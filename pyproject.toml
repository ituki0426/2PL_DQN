[project]
name = "2pl-dqn"
version = "0.1.0"
description = "DQN-based computerized adaptive testing experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "matplotlib",
    "irw>=0.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pip>=26.2.1",
]
